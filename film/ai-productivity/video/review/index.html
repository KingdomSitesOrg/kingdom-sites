<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI productivity film review</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 12px; }
  #stage { padding-top: 12px; }
  #frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #F7F1EE; }
  #player { position: absolute; inset: 0; }
  #shield { position: absolute; inset: 0; cursor: crosshair; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #e5484d; color: #fff; font: 600 12px/22px system-ui; text-align: center; box-shadow: 0 0 0 3px rgba(255,255,255,.85); pointer-events: none; }
  .pin.draft { background: #0090ff; }
  .pin.done { background: #666; }
  #bar { margin: 8px auto; display: flex; gap: 10px; align-items: center; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; min-height: 32px; }
  button:hover { background: #3a3a3a; }
  #track { position: relative; flex: 1; }
  #scrub { width: 100%; margin: 0; }
  #marks { position: absolute; left: 0; right: 0; top: -8px; height: 6px; pointer-events: none; }
  #marks i { position: absolute; width: 3px; height: 6px; margin-left: -1px; background: #e5484d; border-radius: 1px; }
  #marks i.done { background: #555; }
  #time { font-variant-numeric: tabular-nums; min-width: 190px; text-align: end; }
  #scenes { display: flex; flex-wrap: wrap; gap: 6px; }
  #scenes button { background: none; color: #aaa; border-radius: 999px; padding: 3px 10px; border-color: #333; }
  #scenes button:hover { color: #fff; border-color: #666; }
  #help { margin: 8px auto; color: #777; }
  #notes { margin: 14px auto 40px; border-top: 1px solid #2a2a2a; padding-top: 12px; }
  #notes h2 { font-size: 14px; margin: 0 0 8px; color: #eee; font-weight: 600; }
  #compose { display: flex; gap: 8px; align-items: flex-start; }
  #text { flex: 1; min-height: 44px; resize: vertical; background: #1b1b1b; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px; font: inherit; }
  #text:focus { outline: 1px solid #0090ff; }
  #add { background: #0b5fae; border-color: #0b5fae; white-space: nowrap; }
  #add:hover { background: #0d6fcc; }
  #spot { color: #888; margin: 6px 0 10px; }
  #spot button { padding: 1px 8px; font-size: 12px; min-height: 0; }
  #list { display: flex; flex-direction: column; gap: 6px; }
  .note { display: flex; gap: 10px; align-items: flex-start; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 10px; }
  .note.done { opacity: .5; }
  .note .t { color: #9cf; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note .t:hover { text-decoration: underline; }
  .note .body { flex: 1; white-space: pre-wrap; }
  .note .tag { color: #888; font-size: 12px; }
  .note .reply { color: #9fd3c7; margin-top: 4px; }
  .note button { padding: 2px 8px; font-size: 12px; min-height: 0; }
  #status { color: #777; margin-left: 8px; font-weight: 400; }
  #err { color: #f88; white-space: pre-wrap; }
  @media (max-width: 700px) { #time { min-width: 0; font-size: 11px; } #compose { flex-direction: column; } #add { width: 100%; } }
</style>
</head>
<body>
  <div id="stage" class="wrap"><div id="frame"><div id="player"></div><div id="shield"></div></div></div>
  <div id="bar" class="wrap">
    <button id="play">Play</button>
    <div id="track"><div id="marks"></div><input id="scrub" type="range" min="0" value="0" step="1"></div>
    <span id="time"></span>
  </div>
  <div id="scenes" class="wrap"></div>
  <div id="help" class="wrap">Space play/pause · ←/→ one frame · Shift+←/→ one second · R reload the latest cut · N write a note · click the picture to point at something</div>
  <div id="notes" class="wrap">
    <h2>Notes for Claude <span id="status"></span></h2>
    <div id="compose">
      <textarea id="text" placeholder="Pause where you want a change and write it here. Click the picture first to point at something."></textarea>
      <button id="add">Add note</button>
    </div>
    <div id="spot"></div>
    <div id="list"></div>
  </div>
  <div id="err" class="wrap"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
