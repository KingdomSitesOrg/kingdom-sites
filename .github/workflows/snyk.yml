name: Snyk Security Scan

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  snyk:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Snyk is an advisory scan, not a gate. A missing or expired Snyk account
    # token used to paint every commit red even though the site built and
    # deployed fine; the Build workflow is what actually decides pass or fail.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs against the public advisory database, so it needs no account and
      # always reports something useful even when the Snyk token is missing.
      - name: Check dependencies for known high-severity problems
        run: npm audit --audit-level=high

      # A token that is set but expired or revoked is treated like a missing one:
      # the Snyk scan is skipped with a warning on the run, rather than failing on
      # a login error. Snyk then only fails the job by finding real problems.
      - name: Check whether a working Snyk token is available
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::No SNYK_TOKEN secret is set, so the Snyk scan was skipped."
            echo "usable=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $SNYK_TOKEN" \
            "https://api.snyk.io/rest/self?version=2024-10-15")
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::warning::Snyk rejected the SNYK_TOKEN secret (HTTP $status), so the Snyk scan was skipped. Replace the secret with a current Snyk token to turn it back on."
            echo "usable=no" >> "$GITHUB_OUTPUT"
          else
            echo "usable=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk vulnerability scan
        if: steps.token.outputs.usable == 'yes'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
