name: Snyk Security Scan

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  snyk:
    runs-on: ubuntu-latest
    # Snyk is an advisory scan, not a gate. A missing or expired Snyk account
    # token used to paint every commit red even though the site built and
    # deployed fine; the Build workflow is what actually decides pass or fail.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs against the public advisory database, so it needs no account and
      # always reports something useful even when the Snyk token is missing.
      - name: Check dependencies for known high-severity problems
        run: npm audit --audit-level=high

      - name: Check whether a Snyk token is available
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: echo "present=${SNYK_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - name: Run Snyk vulnerability scan
        if: steps.token.outputs.present == 'yes'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
